<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .scroll-container {
            width: 100%;
            height: 200px;
            overflow-y: scroll;
            border: 1px solid #ccc;
        }
        .section {
            padding: 0 10px;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background-color: pink;
            padding: 8px 12px;
            margin: 0 -10px;
        }
        ul{
            margin: 12px 0 20px 20px;
        }
    </style>
</body>
<div class="scroll-container">
    <h2 class="sticky-header">A</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
</div>
</html>
