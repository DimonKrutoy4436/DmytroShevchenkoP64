<!DOCTYPE html>
<html lang="uk" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfoliomaker — Конструктор PDF-портфоліо фрілансера</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        .preview-paper {
            width: 210mm;
            min-height: 297mm;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15);
            background: white;
            transition: all 0.3s ease;
        }
        @media (max-width: 1024px) {
            .preview-paper {
                width: 100%;
                min-height: auto;
            }
        }
        .theme-accent-bg { background-color: var(--accent-color, #4f46e5); }
        .theme-accent-text { color: var(--accent-color, #4f46e5); }
        .theme-accent-border { border-color: var(--accent-color, #4f46e5); }
        .theme-accent-ring { --tw-ring-color: var(--accent-color, #4f46e5); }
    </style>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col min-h-screen">

    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-xl">
                    <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Portfoliomaker</h1>
                    <p class="text-xs text-slate-400">Генератор PDF-портфоліо фрілансера</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button onclick="fillSampleData()" class="px-3 py-1.5 text-xs sm:text-sm font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg transition flex items-center gap-1.5 border border-slate-700">
                    <i class="fa-solid fa-bolt text-amber-400"></i>
                    <span class="hidden sm:inline">Демо-дані</span>
                </button>
                <button onclick="openChecklistModal()" class="px-4 py-1.5 text-xs sm:text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg transition shadow-sm flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Завантажити PDF</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- LEFT PANEL: Editor & Settings -->
        <section class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Template & Styling Selection -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-base font-semibold text-slate-900 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-palette text-indigo-600"></i> Дизайн та Стиль
                </h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Обрати шаблон</label>
                        <select id="templateSelect" onchange="updatePortfolio()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="minimalist">Modern Minimalist (Сучасний)</option>
                            <option value="tech">Tech Dark / Cyber (Темний)</option>
                            <option value="creative">Elegant Serif (Елегантний)</option>
                            <option value="corporate">Corporate Clean (Класичний)</option>
                            <option value="startup">Vibrant Startup (Яскравий)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-2">Акцентний колір</label>
                        <div class="flex items-center gap-3">
                            <button onclick="setAccentColor('#4f46e5')" class="w-7 h-7 rounded-full bg-indigo-600 ring-2 ring-offset-2 ring-transparent focus:ring-indigo-600 hover:scale-110 transition"></button>
                            <button onclick="setAccentColor('#059669')" class="w-7 h-7 rounded-full bg-emerald-600 ring-2 ring-offset-2 ring-transparent focus:ring-emerald-600 hover:scale-110 transition"></button>
                            <button onclick="setAccentColor('#7c3aed')" class="w-7 h-7 rounded-full bg-violet-600 ring-2 ring-offset-2 ring-transparent focus:ring-violet-600 hover:scale-110 transition"></button>
                            <button onclick="setAccentColor('#d97706')" class="w-7 h-7 rounded-full bg-amber-600 ring-2 ring-offset-2 ring-transparent focus:ring-amber-600 hover:scale-110 transition"></button>
                            <button onclick="setAccentColor('#e11d48')" class="w-7 h-7 rounded-full bg-rose-600 ring-2 ring-offset-2 ring-transparent focus:ring-rose-600 hover:scale-110 transition"></button>
                            <button onclick="setAccentColor('#0891b2')" class="w-7 h-7 rounded-full bg-cyan-600 ring-2 ring-offset-2 ring-transparent focus:ring-cyan-600 hover:scale-110 transition"></button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col flex-1">
                <!-- Navigation Tabs -->
                <div class="flex border-b border-slate-200 bg-slate-50 overflow-x-auto">
                    <button onclick="switchTab('tab-personal')" id="btn-tab-personal" class="tab-btn px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-indigo-600 text-indigo-600 whitespace-nowrap flex items-center gap-2">
                        <i class="fa-solid fa-user"></i> Особисте
                    </button>
                    <button onclick="switchTab('tab-projects')" id="btn-tab-projects" class="tab-btn px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2">
                        <i class="fa-solid fa-briefcase"></i> Проєкти
                    </button>
                    <button onclick="switchTab('tab-proof')" id="btn-tab-proof" class="tab-btn px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2">
                        <i class="fa-solid fa-star"></i> Відгуки
                    </button>
                    <button onclick="switchTab('tab-contacts')" id="btn-tab-contacts" class="tab-btn px-4 py-3 text-xs sm:text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-700 whitespace-nowrap flex items-center gap-2">
                        <i class="fa-solid fa-address-book"></i> Контакти
                    </button>
                </div>

                <div class="p-5 space-y-4 flex-1">
                    
                    <!-- TAB 1: Personal Info -->
                    <div id="tab-personal" class="tab-content space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Повне ім'я</label>
                            <input type="text" id="input-name" oninput="updatePortfolio()" placeholder="Олександр Коваленко" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Спеціалізація / Професія</label>
                            <input type="text" id="input-role" oninput="updatePortfolio()" placeholder="Full-Stack Web Developer" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">URL фото / Аватара</label>
                            <input type="text" id="input-photo" oninput="updatePortfolio()" placeholder="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Про себе / Біографія</label>
                            <textarea id="input-bio" oninput="updatePortfolio()" rows="4" placeholder="Роззкажіть про ваш досвід, сильні сторони та підхід до роботи..." class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                        </div>
                    </div>

                    <!-- TAB 2: Projects -->
                    <div id="tab-projects" class="tab-content hidden space-y-4">
                        <div id="projects-container" class="space-y-4">
                            <!-- Projects list rendered dynamically -->
                        </div>
                        <button onclick="addProject()" class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-sm font-semibold transition border border-indigo-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> Додати проєкт
                        </button>
                    </div>

                    <!-- TAB 3: Social Proof / Testimonials -->
                    <div id="tab-proof" class="tab-content hidden space-y-4">
                        <div id="testimonials-container" class="space-y-4">
                            <!-- Testimonials rendered dynamically -->
                        </div>
                        <button onclick="addTestimonial()" class="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-sm font-semibold transition border border-indigo-200 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-plus"></i> Додати відгук / Доказ
                        </button>
                    </div>

                    <!-- TAB 4: Contacts -->
                    <div id="tab-contacts" class="tab-content hidden space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                            <input type="email" id="input-email" oninput="updatePortfolio()" placeholder="alex.freelance@gmail.com" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Телефон</label>
                            <input type="text" id="input-phone" oninput="updatePortfolio()" placeholder="+380 67 123 45 67" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Telegram</label>
                            <input type="text" id="input-telegram" oninput="updatePortfolio()" placeholder="@alex_dev" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">LinkedIn</label>
                            <input type="text" id="input-linkedin" oninput="updatePortfolio()" placeholder="linkedin.com/in/alex-kovalenko" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">GitHub / Сайт</label>
                            <input type="text" id="input-github" oninput="updatePortfolio()" placeholder="github.com/alexkovalenko" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Live PDF Preview Canvas -->
        <section class="lg:col-span-7 flex flex-col items-center">
            <div class="w-full flex items-center justify-between mb-3 px-1">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center gap-2">
                    <i class="fa-solid fa-eye text-indigo-500"></i> Інтерактивний Live-прев'ю
                </span>
                <span class="text-xs text-slate-400">Формат А4 (PDF)</span>
            </div>

            <div class="w-full flex justify-center overflow-x-auto p-2 bg-slate-200/60 rounded-2xl border border-slate-300/60 min-h-[600px]">
                <div id="portfolio-preview" class="preview-paper p-8 text-slate-800 flex flex-col">
                    <!-- Dynamic rendering of selected design template -->
                </div>
            </div>
        </section>

    </main>

    <div id="checklistModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 transform transition-all">
            <div class="flex items-center justify-between mb-4 border-b border-slate-100 pb-3">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-check text-indigo-600"></i> Перевірка перед завантаженням
                </h3>
                <button onclick="closeChecklistModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <p class="text-sm text-slate-600 mb-4">
                Будь ласка, перевірте ваше портфоліо за допомогою чек-листа, щоб переконатися у відсутності помилок:
            </p>

            <div class="space-y-3 mb-6">
                <label class="flex items-start gap-3 p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100/80 cursor-pointer transition">
                    <input type="checkbox" id="check-contacts" onchange="validateChecklist()" class="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span class="text-xs sm:text-sm text-slate-700">Контактні дані перевірено на відсутність помилок та друкарських описок</span>
                </label>
                <label class="flex items-start gap-3 p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100/80 cursor-pointer transition">
                    <input type="checkbox" id="check-links" onchange="validateChecklist()" class="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span class="text-xs sm:text-sm text-slate-700">Усі посилання на проєкти та соцмережі є робочими та актуальними</span>
                </label>
                <label class="flex items-start gap-3 p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100/80 cursor-pointer transition">
                    <input type="checkbox" id="check-proof" onchange="validateChecklist()" class="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span class="text-xs sm:text-sm text-slate-700">Додано актуальні відгуки, рейтинги або соціальні докази</span>
                </label>
                <label class="flex items-start gap-3 p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100/80 cursor-pointer transition">
                    <input type="checkbox" id="check-design" onchange="validateChecklist()" class="mt-1 h-4 w-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <span class="text-xs sm:text-sm text-slate-700">Обраний шаблон та колірна гама виглядають гармонійно</span>
                </label>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="closeChecklistModal()" class="w-1/2 py-2.5 px-4 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                    Скасувати
                </button>
                <button id="btn-download-final" onclick="generatePDF()" disabled class="w-1/2 py-2.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl shadow-md transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Завантажити PDF
                </button>
            </div>
        </div>
    </div>

    <script>
        // State store
        let accentColor = '#4f46e5';
        let projects = [];
        let testimonials = [];

        // Tab Switcher
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-indigo-600', 'text-indigo-600');
                el.classList.add('border-transparent', 'text-slate-500');
            });

            document.getElementById(tabId).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${tabId}`);
            activeBtn.classList.remove('border-transparent', 'text-slate-500');
            activeBtn.classList.add('border-indigo-600', 'text-indigo-600');
        }

        // Set Accent Color
        function setAccentColor(color) {
            accentColor = color;
            document.documentElement.style.setProperty('--accent-color', color);
            updatePortfolio();
        }

        function addProject(data = { title: '', desc: '', link: '', tech: '' }) {
            const id = Date.now() + Math.random();
            projects.push({ id, ...data });
            renderProjectsInput();
            updatePortfolio();
        }

        function removeProject(id) {
            projects = projects.filter(p => p.id !== id);
            renderProjectsInput();
            updatePortfolio();
        }

        function renderProjectsInput() {
            const container = document.getElementById('projects-container');
            container.innerHTML = '';
            projects.forEach((proj, idx) => {
                const item = document.createElement('div');
                item.className = "p-3.5 bg-slate-50 rounded-xl border border-slate-200 relative space-y-2";
                item.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-500">Проєкт #${idx + 1}</span>
                        <button onclick="removeProject(${proj.id})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">
                            <i class="fa-solid fa-trash"></i> Видалити
                        </button>
                    </div>
                    <input type="text" placeholder="Назва проєкту" value="${proj.title}" oninput="updateProjectData(${proj.id}, 'title', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <textarea placeholder="Опис проєкту..." oninput="updateProjectData(${proj.id}, 'desc', this.value)" rows="2" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">${proj.desc}</textarea>
                    <input type="text" placeholder="Стек (напр. React, Node.js, Tailwind)" value="${proj.tech}" oninput="updateProjectData(${proj.id}, 'tech', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <input type="text" placeholder="Посилання на проєкт" value="${proj.link}" oninput="updateProjectData(${proj.id}, 'link', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                `;
                container.appendChild(item);
            });
        }

        function updateProjectData(id, field, value) {
            const proj = projects.find(p => p.id === id);
            if (proj) {
                proj[field] = value;
                updatePortfolio();
            }
        }

        function addTestimonial(data = { author: '', company: '', text: '', rating: 5 }) {
            const id = Date.now() + Math.random();
            testimonials.push({ id, ...data });
            renderTestimonialsInput();
            updatePortfolio();
        }

        function removeTestimonial(id) {
            testimonials = testimonials.filter(t => t.id !== id);
            renderTestimonialsInput();
            updatePortfolio();
        }

        function renderTestimonialsInput() {
            const container = document.getElementById('testimonials-container');
            container.innerHTML = '';
            testimonials.forEach((item, idx) => {
                const block = document.createElement('div');
                block.className = "p-3.5 bg-slate-50 rounded-xl border border-slate-200 relative space-y-2";
                block.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-500">Відгук #${idx + 1}</span>
                        <button onclick="removeTestimonial(${item.id})" class="text-rose-500 hover:text-rose-700 text-xs font-semibold">
                            <i class="fa-solid fa-trash"></i> Видалити
                        </button>
                    </div>
                    <input type="text" placeholder="Ім'я клієнта / Замовник" value="${item.author}" oninput="updateTestimonialData(${item.id}, 'author', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <input type="text" placeholder="Компанія / Посада" value="${item.company}" oninput="updateTestimonialData(${item.id}, 'company', this.value)" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <textarea placeholder="Текст відгуку..." oninput="updateTestimonialData(${item.id}, 'text', this.value)" rows="2" class="w-full border border-slate-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none">${item.text}</textarea>
                `;
                container.appendChild(block);
            });
        }

        function updateTestimonialData(id, field, value) {
            const t = testimonials.find(item => item.id === id);
            if (t) {
                t[field] = value;
                updatePortfolio();
            }
        }

        function fillSampleData() {
            document.getElementById('input-name').value = "Максим Дерев'янко";
            document.getElementById('input-role').value = "Senior UI/UX Designer & Webflow Developer";
            document.getElementById('input-photo').value = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300";
            document.getElementById('input-bio').value = "Понад 5 років створюю сучасні, конверсійні веб-інтерфейси та мобільні додатки. Допомагаю стартапам та бізнесу перетворювати складні ідеї на зручні цифрові продукти з фокусом на UX та естетику.";
            
            document.getElementById('input-email').value = "m.derevianko@gmail.com";
            document.getElementById('input-phone').value = "+380 97 888 77 66";
            document.getElementById('input-telegram').value = "@max_uiux";
            document.getElementById('input-linkedin').value = "linkedin.com/in/max-uiux";
            document.getElementById('input-github').value = "dribbble.com/max_uiux";

            projects = [
                {
                    id: 1,
                    title: "FinTech Мобільний Банкінг",

        function openChecklistModal() {
            document.getElementById('checklistModal').classList.remove('hidden');
        }

        function closeChecklistModal() {
            document.getElementById('checklistModal').classList.add('hidden');
        }

        function validateChecklist() {
            const c1 = document.getElementById('check-contacts').checked;
            const c2 = document.getElementById('check-links').checked;
            const c3 = document.getElementById('check-proof').checked;
            const c4 = document.getElementById('check-design').checked;

            const downloadBtn = document.getElementById('btn-download-final');
            downloadBtn.disabled = !(c1 && c2 && c3 && c4);
        }

        function generatePDF() {
            closeChecklistModal();
            const element = document.getElementById('portfolio-preview');
            const name = document.getElementById('input-name').value || 'freelancer';
            
            const opt = {
                margin:       0,
                filename:     `Portfolio_${name.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // Initialize default view
        window.onload = function() {
            fillSampleData();
        };
