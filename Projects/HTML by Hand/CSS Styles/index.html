<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<style>
.button {
     display: inline;
            font-family: Arial, Helvetica, sans-serif;
            background-color: green;
            color: white;
            text-transform: uppercase;
            font-size: 20px;
            border: 2px solid greenyellow;
            border-radius: 0px;
            cursor: pointer;
            padding-right: 10px;
            padding-left: 5px;
}

.button1 {
     display: inline;
            font-family: Arial, Helvetica, sans-serif;
            background-color: red;
            color: white;
            text-transform: uppercase;
            font-size: 20px;
            border: 2px solid pink;
            border-radius: 0px;
            cursor: pointer;
            padding-right: 10px;
            padding-left: 3px;
}

.button2 {
     display: inline;
            font-family: Arial, Helvetica, sans-serif;
            background-color: yellow;
            color: white;
            text-transform: uppercase;
            font-size: 20px;
            border: 2px solid orange;
            border-radius: 0px;
            cursor: pointer;
            padding-right: 5px;
            padding-left: 3px;
}

.container {
    text-align: center;
    margin-top: 10px;
    word-spacing: 25px;
}

.badge {
    font-size: 40px;
    font-weight: bold;
    text-transform: uppercase;
}

</style>
</head>
<body>
    
    <div class="container">
    <span class="button">Fixed</span>
        <p class="button1">Critical</p>
        <p class="button2">Warning</p>
    </div>

</body>
</html>
