<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url("../assets/background.jpg");
            background-position: center;
        }
        .container {
            position: relative;
            width: 150px;
            height: 200px;
            border: 0.5px solid;
        }
        .container img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="img" src="../assets/dog.jpg" alt="dog">
    </div>
</body>
</html>
